function $(x){return document.getElementById(x)} function show(id){["career","world","scout","record"].forEach(x=>$(x).classList.toggle("hide",x!==id));if(id==="world")renderWorld();if(id==="scout")renderScout();if(id==="record")renderHistory()}

const ROLES=["野手先發","投手先發＋打擊","野手先發","野手先發","投手先發＋打擊","野手先發"];

function playHitter(){let outs=[bat(),bat(),bat(),bat()];S.stats.g++;S.stats.po+=2+Math.floor(Math.random()*4);S.stats.a+=1+Math.floor(Math.random()*3);S.history.push(`第${S.game+1}戰｜野手先發｜${outs.join("、")}｜守備無失誤`);S.game++;scoutTick();save(false);renderCareer()}

function nextSchoolYear(){S.year=(S.year||1)+1;S.game=0;S.history.push(`進入高中第${S.year}年｜${S.player.school}`);Object.values(S.scouts).forEach(x=>x.interest=Math.min(100,x.interest+5));save(false);renderCareer()}

function proMonth(){
 ensurePro();let p=S.pro,phase=PRO_CAL[p.month],x=p.proStats;
 if(phase==="春訓"){S.history.push(`${p.team}｜春訓｜競爭${p.status}席位`);promote(true)}

}
function awardSeason(){
 let p=S.pro,x=p.proStats;if(x.g>=50){p.awards.push(`第${p.season}季 年度MVP候選`);if(x.hr>=20)p.awards.push(`第${p.season}季 長打獎項候選`);if(x.ip>=80&&x.k>=100)p.awards.push(`第${p.season}季 投手獎項候選`)}
 S.history.push(`${p.team}｜年度結算｜G ${x.g}・H ${x.h}・HR ${x.hr}・K ${x.k}`);p.proStats={g:0,ab:0,h:0,hr:0,rbi:0,ip:0,k:0,er:0}
}

function makeSchedule(){
 ensurePro();let p=S.pro;if(p.schedule&&p.scheduleSeason===p.season)return;
 let n=p.league==="MLB"?24:p.league==="NPB"?20:p.league==="KBO"?20:18;
 p.schedule=[];for(let i=0;i<n;i++){let pitcher=(S.player.type!=="野手"&&i%5===0);p.schedule.push({id:i+1,month:1+Math.floor(i/(n/6)),role:pitcher?"先發投手＋打擊":"野手先發",played:false,result:null,manual:false})}
 p.scheduleSeason=p.season;
}
function scheduleHtml(){
 makeSchedule();let p=S.pro,remaining=p.schedule.filter(g=>!g.played);let next=remaining[0];
 let rows=p.schedule.map(g=>`<tr><td>${g.id}</td><td>${g.role}</td><td>${g.played?(g.result||"完成"):"未賽"}</td></tr>`).join("");
 return `<div class="event"><b>本季可玩賽程</b><br>關鍵場可以親自打，其餘可以快速模擬。二刀流約每5場安排一次投手先發。</div>
 ${next?`<button class="accent" onclick="manualProGame(${next.id})">親自打第 ${next.id} 場</button> <button onclick="simProGames(5)">模擬接下來5場</button>`:"<span class=gold>本批賽程已完成</span>"}
 <details><summary>查看賽程表</summary><table><tr><th>#</th><th>角色</th><th>結果</th></tr>${rows}</table></details>`;
}
function manualProGame(id){
 ensurePro();makeSchedule();let g=S.pro.schedule.find(x=>x.id===id&&!x.played);if(!g)return;
 S.live={gid:id,role:g.role,inn:1,half:"上",outs:0,balls:0,strikes:0,us:0,them:0,bases:[0,0,0],log:[],pa:0,pitches:0};
 renderLive();
}
function renderLive(){
 let L=S.live;if(!L)return;let pitching=L.role.includes("投手")&&L.inn<=7;
 $("gameTitle").textContent=`第 ${L.gid} 場｜${L.inn}局${L.half}｜${L.us}：${L.them}`;
 $("gameBody").innerHTML=`<div class="event"><b>${pitching?"你正在投球":"你正在打擊／守備"}</b><br>
 出局 ${L.outs}｜球數 ${L.balls}-${L.strikes}｜壘包 ${L.bases.map((x,i)=>x?["一","二","三"][i]:"－").join(" ")}<br>
 比分：${S.pro.team} ${L.us}：${L.them}</div>
 <div class="grid">${pitching?`<select id="ptype"><option>四縫線速球</option><option>二縫線速球</option><option>卡特球</option><option>滑球</option><option>曲球</option><option>變速球</option><option>指叉球</option><option>伸卡球</option></select><div><b>九宮格目標</b><div style="display:grid;grid-template-columns:repeat(3,48px);gap:3px;margin-top:5px">${[1,2,3,4,5,6,7,8,9].map(z=>`<button style="padding:8px" onclick="pitch(document.getElementById('ptype').value,${z})">${z}</button>`).join("")}</div></div>`:`<button class="accent" onclick="swing('強振')">強振</button><button onclick="swing('正常')">正常揮擊</button><button onclick="swing('選球')">選球</button><button onclick="swing('短打')">短打</button><button onclick="steal()">盜壘</button>`}</div>
 <div class="event" style="max-height:220px;overflow:auto">${L.log.slice(-10).reverse().join("<br>")||"比賽開始"}</div>`;
}
function swing(mode){
 let L=S.live;if(!L)return;L.pa++;let r=Math.random(),res;
 if(mode==="選球"&&r<.45){L.balls++;res="壞球";if(L.balls>=4){res="四壞保送";advance(1);resetCount()}}
 else if(r<.12){L.strikes++;res="揮空";if(L.strikes>=3){res="三振";L.outs++;resetCount()}}
 else if(r<.23){L.strikes=Math.min(2,L.strikes+1);res="界外球"}
 else if(r<.45){res="一壘安打";advance(1);resetCount()}
 else if(r<.62){res="二壘安打";advance(2);resetCount()}
 else if(r<.69){res="三壘安打";advance(3);resetCount()}
 else if(r<.83){res="全壘打";advance(4);resetCount()}
 else {if(mode!=="短打"&&L.bases[2]&&L.outs<2&&Math.random()<.45){res="高飛犧牲打，三壘跑者得分";L.bases[2]=0;L.us++}else res=mode==="短打"?"犧牲觸擊出局":"強勁出局";L.outs++;resetCount()}
 L.log.push(`打擊｜${mode} → ${res}`);checkInning()
}
function pitch(kind,zone=5){
 let L=S.live;if(!L)return;L.pitches++;let edge=[1,3,7,9].includes(zone),center=zone===5,velo=pitchVelo(kind),r=Math.random(),res;
 let strikeChance=center?.62:edge?.48:.54;
 if(r<strikeChance){L.strikes++;res=`${kind} ${velo} km/h｜${zone}號位 好球`;if(L.strikes>=3){res=`${kind}｜三振！`;L.outs++;resetCount()}}
 else if(r<strikeChance+.18){L.balls++;res=`${kind} ${velo} km/h｜${zone}號位 壞球`;if(L.balls>=4){res=`${kind}｜四壞`;oppAdvance(1);resetCount()}}
 else if(r<strikeChance+.36){res=`${kind} ${velo} km/h｜滾地球`;defensePlay();resetCount()}
 else if(r<strikeChance+.45){res=`${kind} ${velo} km/h｜被敲安打`;oppAdvance(1);resetCount()}
 else {res=`${kind} ${velo} km/h｜被轟全壘打`;oppAdvance(4);resetCount()}
 L.log.push(`投球 #${L.pitches}｜${res}`);checkInning()
}
function pitchVelo(k){let base=k.includes("四縫")?160:k.includes("二縫")?157:k.includes("卡特")?151:k.includes("伸卡")?155:k.includes("指叉")?146:k.includes("滑")?143:k.includes("曲")?132:139;return base+Math.floor(Math.random()*5)}
function defensePlay(){let L=S.live,r=Math.random();if(r<.20&&L.bases[0]){L.outs=Math.min(3,L.outs+2);L.bases[0]=0;L.log.push("守備｜二游間漂亮轉傳，雙殺！")}else if(r<.65){L.outs++;L.log.push(`守備｜${S.player.pos}完成刺殺`)}else{L.outs++;L.log.push("守備｜外野接殺")}}
function steal(){let L=S.live;if(!L||!L.bases[0]){L.log.push("跑壘｜一壘無跑者，無法盜壘");renderLive();return}if(Math.random()<.88){L.bases[0]=0;L.bases[1]=1;L.log.push("跑壘｜盜二壘成功！")}else{L.bases[0]=0;L.outs++;L.log.push("跑壘｜盜壘失敗，遭觸殺")}checkInning()}
function resetCount(){S.live.balls=0;S.live.strikes=0}
function advance(n){let L=S.live;if(n===4){L.us+=1+L.bases.reduce((a,b)=>a+b,0);L.bases=[0,0,0];return}for(let i=2;i>=0;i--)if(L.bases[i]){let to=i+n;if(to>=3)L.us++;else L.bases[to]=1;L.bases[i]=0}L.bases[n-1]=1}
function oppAdvance(n){let L=S.live;if(n===4){L.them+=1+L.bases.reduce((a,b)=>a+b,0);L.bases=[0,0,0];return}for(let i=2;i>=0;i--)if(L.bases[i]){let to=i+n;if(to>=3)L.them++;else L.bases[to]=1;L.bases[i]=0}L.bases[n-1]=1}
function checkInning(){
 let L=S.live;if(L.outs<3){renderLive();return}
 L.outs=0;L.balls=0;L.strikes=0;L.bases=[0,0,0];
 if(L.half==="上"){L.half="下";L.log.push(`── ${L.inn}局下 ──`)}
 else{L.inn++;L.half="上";L.log.push(`── ${L.inn}局上 ──`)}
 if(L.inn>9&&L.us!==L.them){finishLive();return}
 if(L.inn>12&&L.us===L.them){L.us++;finishLive();return}
 // Non-user half is compactly simulated so the game remains playable.
 if(!(L.role.includes("投手")&&L.inn<=7)){let add=Math.random()<.28?1:0;L.them+=add}
 renderLive()
}
function finishLive(){
 let L=S.live,p=S.pro,g=p.schedule.find(x=>x.id===L.gid),x=p.proStats,win=L.us>L.them;
 g.played=true;g.manual=true;g.result=win?"勝":"敗";p[win?"wins":"losses"]++;x.g++;
 let hits=L.log.filter(x=>x.includes("安打")||x.includes("全壘打")).length,hrs=L.log.filter(x=>x.includes("全壘打")).length;
 x.ab+=Math.max(1,L.pa);x.h+=hits;x.hr+=hrs;x.rbi+=Math.max(0,L.us-1);
 if(L.role.includes("投手")){x.ip+=Math.min(7,L.inn-1);x.k+=L.log.filter(x=>x.includes("三振！")).length;x.er+=L.them}
 S.history.push(`${p.team}｜第${L.gid}場｜${win?"勝":"敗"} ${L.us}:${L.them}｜親自操作`);
 S.live=null;save(false);renderCareer()
}
function batPro(){let r=Math.random();return r<.18?"全壘打":r<.38?"二壘安打":r<.66?"一壘安打":r<.72?"三壘安打":r<.82?"四壞":r<.93?"強勁出局":"飛球出局"}
function simProGames(n){
 ensurePro();makeSchedule();let gs=S.pro.schedule.filter(g=>!g.played).slice(0,n),x=S.pro.proStats;
 gs.forEach(g=>{let win=Math.random()<.55;S.pro[win?"wins":"losses"]++;g.played=true;g.result=win?"勝":"敗";x.g++;x.ab+=4;x.h+=1+Math.floor(Math.random()*3);if(Math.random()<.35)x.hr++;x.rbi+=Math.floor(Math.random()*3);if(g.role.includes("投手")){let ip=5+Math.floor(Math.random()*3);x.ip+=ip;x.k+=8+Math.floor(Math.random()*7);x.er+=Math.random()<.7?0:1}});
 S.history.push(`${S.pro.team}｜快速模擬 ${gs.length} 場`);save(false);renderCareer()
}
function proPanel(){
 ensurePro();let p=S.pro,x=p.proStats,phase=PRO_CAL[p.month]||"休賽季";return `<div class="event"><b>${p.team}｜職業第${p.season}季</b><br>目前：${p.status}｜階段：${phase}<br>球隊：${p.wins}勝 ${p.losses}敗<br>本季：G ${x.g}｜H ${x.h}｜HR ${x.hr}｜RBI ${x.rbi}｜IP ${x.ip}.0｜K ${x.k}<br>${p.awards.length?`榮譽：${p.awards.join("、")}`:""}</div>${["3／4月","5月","6月","7月","8月","9月"].includes(phase)?scheduleHtml():""}<button class="accent" onclick="proMonth()">完成 ${phase} 並推進月份</button>`}
function renderStats(){let x=S.stats;$("stats").innerHTML=`G ${x.g}｜AB ${x.ab}｜H ${x.h}｜HR ${x.hr}｜RBI ${x.rbi}<br>IP ${x.ip}.0｜K ${x.k}｜ER ${x.er}｜ERA ${x.ip?(x.er*9/x.ip).toFixed(2):"0.00"}<br>守備 PO ${x.po}｜A ${x.a}｜E ${x.e}`}
function renderWorld(){let tabs=["MLB","NPB","KBO","CPBL"];$("leagueTabs").innerHTML=tabs.map(x=>`<button onclick="league='${x}';renderWorld()">${x}</button>`).join("");if(league==="MLB"){$("leagueView").innerHTML=`<div class="event"><b>MLB 專屬制度</b><br>新人選秀／國際業餘簽約 → 1A → 高階1A → 2A → 3A → 40人名單 → 大聯盟現役名單<br>另追蹤：下放、升上大聯盟、指定讓渡、讓渡程序、傷兵名單、交易、薪資仲裁、自由球員。</div>`+Object.entries(MLB).map(([lg,ds])=>`<h2>${lg}</h2>`+Object.entries(ds).map(([d,ts])=>`<h3>${d}</h3>${ts.map(t=>`<button class="team" onclick="team('${t}')">${TEAM_ZH[t]}</button>`).join("")}`).join("")).join("")}else{let arr=league==="NPB"?NPB:league==="KBO"?KBO:CPBL;$("leagueView").innerHTML=`<div class="event">${league==="NPB"?"日職：支配下／育成、一軍登錄、FA、入札制度各自追蹤。":league==="KBO"?"韓職：新人選秀、Futures、一軍登錄／抹消、FA與海外交涉。":"中職：選秀、簽約、二軍／一軍、FA與旅外流程。"}</div>`+arr.map(x=>`<span class="pill">${x}</span>`).join("")}}
function team(t){let d=DATA[t]||{manager:"資料核對中",coaches:[],players:[],farm:[]};$("leagueView").innerHTML=`<button onclick="renderWorld()">← 返回</button><h2>${TEAM_ZH[t]}</h2><b>總教練：</b>${d.manager}<h3>教練團</h3>${d.coaches.length?d.coaches.map(x=>`<div>${x}</div>`).join(""):"<span class=mut>持續核對2026官方資料</span>"}<h3>球員</h3>${d.players.length?`<table>${d.players.map(x=>`<tr>${x.split("｜").map(y=>`<td>${y}</td>`).join("")}</tr>`).join("")}</table>`:"<span class=mut>持續核對2026現役／40人名單</span>"}<h3>農場</h3>${d.farm.map(x=>`<div class=pill>${x}</div>`).join("")}`}
function renderScout(){$("scoutView").innerHTML=Object.entries(S.scouts).length?Object.entries(S.scouts).map(([l,x])=>`<div class="event"><b>${l}</b>｜觀察 ${x.views} 次｜興趣 ${x.interest}/100<br>20–80評分：打擊80｜長打80｜速度80｜臂力80｜守備80｜投球80｜控球80</div>`).join(""):"完成正式比賽後，各聯盟球探會累積獨立觀察。"}
function renderHistory(){$("history").innerHTML=S.history.length?S.history.slice().reverse().map(x=>`<div>${x}</div>`).join(""):"尚無紀錄"}
function save(a=true){localStorage.setItem(KEY,JSON.stringify(S));if(a)alert("已儲存")}function reset(){if(confirm("確定刪除生涯？")){localStorage.removeItem(KEY);location.reload()}}
function load(){schools();try{let x=JSON.parse(localStorage.getItem(KEY));if(x&&x.player)S=x}catch(e){}if(S.player)renderCareer()}load();
</script></body></html>
