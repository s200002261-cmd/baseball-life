 let rows=p.schedule.map(g=>`<tr><td>${g.id}</td><td>${g.opponent||"待定"}<br><small>${g.opponent?difficultyLabel(teamStrength(g.opponent)):""}</small></td><td>${g.role}</td><td>${g.played?(g.result||"完成"):"未賽"}</td></tr>`).join("");
 return `<div class="event"><b>本季可玩賽程</b><br>關鍵場可以親自打，其餘可以快速模擬。二刀流約每5場安排一次投手先發。</div>
 ${next?`<button class="accent" onclick="manualProGame(${next.id})">親自打第 ${next.id} 場</button> <button onclick="simProGames(5)">模擬接下來5場</button>`:"<span class=gold>本批賽程已完成</span>"}
 <details><summary>查看賽程表</summary><table><tr><th>#</th><th>對手</th><th>角色</th><th>結果</th></tr>${rows}</table></details>`;
}
function manualProGame(id){
 ensurePro();makeSchedule();let g=S.pro.schedule.find(x=>x.id===id&&!x.played);if(!g)return;
 let opponent=pickOpponent();S.live={gid:id,role:g.role,opponent,oppLineup:opponentLineup(opponent),oppPitcher:(()=>{let r=makeRoster(opponent,S.player.nation).slice(-1)[0];return r})(),oppBatter:0,teamHits:0,oppHits:0,userAB:0,userHits:0,userHR:0,userRBI:0,userIP:0,userK:0,userER:0,inn:1,half:"上",outs:0,balls:0,strikes:0,us:0,them:0,bases:[0,0,0],log:[`今日對手｜${opponent}`],pa:0,pitches:0};
 renderLive();
}
function renderLive(){
 let L=S.live;if(!L)return;let pitching=L.role.includes("投手")&&L.inn<=7&&L.half==="下";
 $("gameTitle").textContent=`第 ${L.gid} 場｜VS ${L.opponent}｜${L.inn}局${L.half}｜${L.us}：${L.them}`;
 $("gameBody").innerHTML=`<div class="event"><b>${pitching?`你正在投球｜對手第${L.oppLineup[L.oppBatter%9].order}棒 ${L.oppLineup[L.oppBatter%9].name}（${L.oppLineup[L.oppBatter%9].hand}・能力${L.oppLineup[L.oppBatter%9].ability}）`:`你正在打擊｜對手：${L.opponent}`}</b><br>
 出局 ${L.outs}｜球數 ${L.balls}-${L.strikes}｜壘包 ${L.bases.map((x,i)=>x?["一","二","三"][i]:"－").join(" ")}<br>
 對手強度：${teamStrength(L.opponent)}｜${difficultyLabel(teamStrength(L.opponent))}<br>比分：${S.pro.team} ${L.us}：${L.them}</div>
 <div class="grid">${pitching?`<button class="accent" onclick="pitchCall('全力攻擊好球帶')">🔥 全力對決</button><button onclick="pitchCall('邊角引誘')">🎯 邊角引誘</button><button onclick="pitchCall('決勝球')">⚡ 決勝球</button><button onclick="pitchCall('省球數')">🧠 省球數</button>`:`<button class="accent" onclick="swing('強振')">強振</button><button onclick="swing('正常')">正常揮擊</button><button onclick="swing('選球')">選球</button><button onclick="swing('短打')">短打</button><button onclick="steal()">盜壘</button>`}</div>
 <div class="event" style="max-height:220px;overflow:auto">${L.log.slice(-10).reverse().join("<br>")||"比賽開始"}</div>`;
}
function swing(mode){
 let L=S.live;if(!L)return;L.pa++;let r=Math.random(),res,opp=L.oppPitcher?.stuff||82,pen=Math.max(0,(opp-80)/700);
 if(mode==="選球"&&r<.48){L.balls++;res="壞球";if(L.balls>=4){res="四壞保送";advance(1);resetCount()}}
 else if(r<.025+pen){L.strikes++;res="揮空";if(L.strikes>=3){res="三振";L.outs++;L.userAB++;resetCount()}}
 else if(r<.075){L.strikes=Math.min(2,L.strikes+1);res="界外球"}
 else if(r<.34-pen){res="一壘安打";L.userAB++;L.userHits++;L.teamHits++;advance(1);resetCount()}
 else if(r<.56-pen){res="二壘安打";L.userAB++;L.userHits++;L.teamHits++;advance(2);resetCount()}
 else if(r<.62-pen){res="三壘安打";L.userAB++;L.userHits++;L.teamHits++;advance(3);resetCount()}
 else if(r<.80-pen){let before=L.us;res="全壘打";L.userAB++;L.userHits++;L.userHR++;L.teamHits++;advance(4);L.userRBI+=L.us-before;resetCount()}
 else {L.userAB++;if(mode!=="短打"&&L.bases[2]&&L.outs<2&&Math.random()<.65){res="高飛犧牲打，三壘跑者得分";L.bases[2]=0;L.us++;L.userRBI++}else res=mode==="短打"?"犧牲觸擊出局":"強勁出局";L.outs++;resetCount()}
 L.log.push(`打擊｜${mode} → ${res}`);checkInning()
}
function pitchCall(plan){
 let pools={
 "全力攻擊好球帶":["四縫線速球","二縫線速球","卡特球"],
 "邊角引誘":["滑球","曲球","變速球"],
 "決勝球":["指叉球","滑球","四縫線速球"],
 "省球數":["二縫線速球","伸卡球","卡特球"]
 },a=pools[plan],kind=a[Math.floor(Math.random()*a.length)],zone=plan==="邊角引誘"?[1,3,7,9][Math.floor(Math.random()*4)]:plan==="決勝球"?[2,5,8][Math.floor(Math.random()*3)]:5;
 pitch(kind,zone,plan)
}
function pitch(kind,zone=5,plan=''){
 let L=S.live;if(!L)return;L.pitches++;let velo=pitchVelo(kind),r=Math.random(),res,b=L.oppLineup?.[L.oppBatter%9]?.ability||80,adj=(b-80)/500;
 // MAX 100 + D6=6: elite command/stuff. Still not guaranteed.
 let kRate=Math.max(.36,(plan==="決勝球"?.62:.48)-adj), weak=.30, hit=.025+adj/2, hr=.003+Math.max(0,adj/10);
 if(r<kRate){L.strikes++;res=`${kind} ${velo} km/h｜揮空`;if(L.strikes>=3){res=`${kind} ${velo} km/h｜三振！`;L.outs++;resetCount()}}
 else if(r<kRate+weak){res=`${kind} ${velo} km/h｜弱擊球`;defensePlay();resetCount();nextOppBatter()}
 else if(r<kRate+weak+hit){res=`${kind} ${velo} km/h｜被敲安打`;L.oppHits++;oppAdvance(1);resetCount();nextOppBatter()}
 else if(r<kRate+weak+hit+hr){res=`${kind} ${velo} km/h｜失投被轟`;L.oppHits++;L.userER++;oppAdvance(4);resetCount();nextOppBatter()}
 else {L.strikes=Math.min(2,L.strikes+1);res=`${kind} ${velo} km/h｜擦棒界外`}
 L.log.push(`投球 #${L.pitches}｜${plan||"配球"}｜${res}`);checkInning()
}
function pitchVelo(k){let base=k.includes("四縫")?160:k.includes("二縫")?157:k.includes("卡特")?151:k.includes("伸卡")?155:k.includes("指叉")?146:k.includes("滑")?143:k.includes("曲")?132:139;return base+Math.floor(Math.random()*5)}
function defensePlay(){let L=S.live,r=Math.random();if(r<.20&&L.bases[0]){L.outs=Math.min(3,L.outs+2);L.bases[0]=0;L.log.push("守備｜二游間漂亮轉傳，雙殺！")}else if(r<.65){L.outs++;L.log.push(`守備｜${S.player.pos}完成刺殺`)}else{L.outs++;L.log.push("守備｜外野接殺")}}
function steal(){let L=S.live;if(!L||!L.bases[0]){L.log.push("跑壘｜一壘無跑者，無法盜壘");renderLive();return}if(Math.random()<.88){L.bases[0]=0;L.bases[1]=1;L.log.push("跑壘｜盜二壘成功！")}else{L.bases[0]=0;L.outs++;L.log.push("跑壘｜盜壘失敗，遭觸殺")}checkInning()}
function nextOppBatter(){if(S.live)S.live.oppBatter=(S.live.oppBatter+1)%9}
function resetCount(){S.live.balls=0;S.live.strikes=0}
function advance(n){let L=S.live;if(n===4){L.us+=1+L.bases.reduce((a,b)=>a+b,0);L.bases=[0,0,0];return}for(let i=2;i>=0;i--)if(L.bases[i]){let to=i+n;if(to>=3)L.us++;else L.bases[to]=1;L.bases[i]=0}L.bases[n-1]=1}
function oppAdvance(n){let L=S.live;if(n===4){L.them+=1+L.bases.reduce((a,b)=>a+b,0);L.bases=[0,0,0];return}for(let i=2;i>=0;i--)if(L.bases[i]){let to=i+n;if(to>=3)L.them++;else L.bases[to]=1;L.bases[i]=0}L.bases[n-1]=1}
function checkInning(){
 let L=S.live;if(L.outs<3){renderLive();return}
 L.outs=0;L.balls=0;L.strikes=0;L.bases=[0,0,0];
 if(L.half==="上"){
   simTeammateHalf();L.half="下";L.log.push(`── ${L.inn}局下｜${L.opponent}進攻 ──`);
   if(!L.role.includes("投手")||L.inn>7){
      let strength=teamStrength(L.opponent),runs=Math.random()<(strength-65)/100?Math.floor(Math.random()*2):0,hits=runs+Math.floor(Math.random()*2);
      L.them+=runs;L.oppHits+=hits;L.log.push(runs?`守備半局｜${L.opponent}攻下${runs}分`:"守備半局｜我方守住，對手無得分");
      if(Math.random()<.42)L.log.push(`守備機會｜${S.player.pos}完成關鍵守備`);
      L.half="上";L.inn++;L.log.push(`── ${L.inn}局上｜我方進攻 ──`);
   }
 }else{
   L.userIP++;L.inn++;L.half="上";L.log.push(`── ${L.inn}局上｜我方進攻 ──`);
 }
 if(L.inn>9&&L.us!==L.them){finishLive();return}
 if(L.inn>12&&L.us===L.them){L.us++;finishLive();return}
 renderLive()
}
function finishLive(){
 let L=S.live,p=S.pro,g=p?.schedule?.find(x=>x.id===L.gid),win=L.us>L.them;
 if(g){g.played=true;g.result=`${win?"勝":"敗"} ${L.us}:${L.them} vs ${L.opponent}`;g.manual=true}
 if(p){p.wins+=win?1:0;p.losses+=win?0:1;let x=p.proStats;x.g++;x.ab+=L.userAB||0;x.h+=L.userHits||0;x.hr+=L.userHR||0;x.rbi+=L.userRBI||0;x.ip+=L.userIP||0;x.k+=L.userK||0;x.er+=L.userER||0;ensureTeamWorld();let st=S.world.standings[p.league];if(st?.[p.team]){st[p.team].w+=win?1:0;st[p.team].l+=win?0:1;st[p.team].rs+=L.us;st[p.team].ra+=L.them}simLeagueDay()}
 S.stats.g++;S.stats.ab+=L.userAB||0;S.stats.h+=L.userHits||0;S.stats.hr+=L.userHR||0;S.stats.rbi+=L.userRBI||0;S.stats.ip+=L.userIP||0;S.stats.k+=L.userK||0;S.stats.er+=L.userER||0;
 S.history.push(`${S.pro?.team||S.player.school} vs ${L.opponent}｜${L.us}:${L.them}｜${win?"勝":"敗"}｜你：${L.userHits||0}H ${L.userHR||0}HR ${L.userRBI||0}RBI${L.role.includes("投手")?`｜${L.userIP||0}IP ${L.userK||0}K`:""}`);
 S.live=null;save(false);renderCareer()
}
function batPro(){let r=Math.random();return r<.18?"全壘打":r<.38?"二壘安打":r<.66?"一壘安打":r<.72?"三壘安打":r<.82?"四壞":r<.93?"強勁出局":"飛球出局"}
function simProGames(n){
 ensurePro();makeSchedule();let gs=S.pro.schedule.filter(g=>!g.played).slice(0,n),x=S.pro.proStats;
 gs.forEach(g=>{let win=Math.random()<.55;S.pro[win?"wins":"losses"]++;g.played=true;g.result=win?"勝":"敗";x.g++;x.ab+=4;x.h+=1+Math.floor(Math.random()*3);if(Math.random()<.35)x.hr++;x.rbi+=Math.floor(Math.random()*3);if(g.role.includes("投手")){let ip=5+Math.floor(Math.random()*3);x.ip+=ip;x.k+=8+Math.floor(Math.random()*7);x.er+=Math.random()<.7?0:1}});
 S.history.push(`${S.pro.team}｜快速模擬 ${gs.length} 場`);save(false);renderCareer()
}
function proPanel(){
 ensurePro();let p=S.pro,x=p.proStats,phase=PRO_CAL[p.month]||"休賽季",sys=PRO_SYSTEM[p.league]||PRO_SYSTEM.CPBL,li=sys.ladder.indexOf(p.status),next=li>=0&&li<sys.ladder.length-1?sys.ladder[li+1]:"最高層級";
 let roster=p.league==="MLB"?(p.status==="40人名單"||p.status==="大聯盟現役名單"?"40人名單：是":"40人名單：否"):"球團登錄：有效";
 let option=p.league==="MLB"?(p.options??3):null;
 return `<div class="event"><b>${p.team}｜職業第${p.season}季</b><br>目前層級：<b>${p.status}</b>｜下一層：${next}<br>${MLB_LEVEL_INFO[p.status]||""}<br>${roster}${option!==null?`｜剩餘選項年：${option}`:""}<br>階段：${phase}｜球隊：${p.wins}勝 ${p.losses}敗<br>本季：G ${x.g}｜H ${x.h}｜HR ${x.hr}｜RBI ${x.rbi}｜IP ${x.ip}.0｜K ${x.k}<br>${p.awards.length?`榮譽：${p.awards.join("、")}`:""}</div>
 <details><summary>🏟️ 球團養成／名單制度</summary><div class="event"><b>升級路徑</b><br>${sys.ladder.map((z,k)=>`${k===li?"▶":"○"} ${z}`).join("<br>")}<br><br><b>制度事件</b><br>${sys.details.join("｜")}</div></details>${careerFrontOffice()}${orgDetails()}${myTeamRosterHtml()}${standingsHtml()}${seasonLeaders()}${transactionHistoryHtml()}${["3／4月","5月","6月","7月","8月","9月"].includes(phase)?scheduleHtml():""}<button class="accent" onclick="proMonth()">完成 ${phase} 並推進月份</button>`}
function renderStats(){let x=S.stats;$("stats").innerHTML=`G ${x.g}｜AB ${x.ab}｜H ${x.h}｜HR ${x.hr}｜RBI ${x.rbi}<br>IP ${x.ip}.0｜K ${x.k}｜ER ${x.er}｜ERA ${x.ip?(x.er*9/x.ip).toFixed(2):"0.00"}<br>守備 PO ${x.po}｜A ${x.a}｜E ${x.e}`}
function renderWorld(){let tabs=["MLB","NPB","KBO","CPBL"];$("leagueTabs").innerHTML=tabs.map(x=>`<button onclick="league='${x}';renderWorld()">${x}</button>`).join("");if(league==="MLB"){$("leagueView").innerHTML=`<div class="event"><b>MLB 專屬制度</b><br>新人選秀／國際業餘簽約 → 1A → 高階1A → 2A → 3A → 40人名單 → 大聯盟現役名單<br>另追蹤：下放、升上大聯盟、指定讓渡、讓渡程序、傷兵名單、交易、薪資仲裁、自由球員。</div>`+Object.entries(MLB).map(([lg,ds])=>`<h2>${lg}</h2>`+Object.entries(ds).map(([d,ts])=>`<h3>${d}</h3>${ts.map(t=>`<button class="team" onclick="team('${t}')">${TEAM_ZH[t]}</button>`).join("")}`).join("")).join("")}else{let arr=league==="NPB"?NPB:league==="KBO"?KBO:CPBL;$("leagueView").innerHTML=`<div class="event">${league==="NPB"?"日職：支配下／育成、一軍登錄、FA、入札制度各自追蹤。":league==="KBO"?"韓職：新人選秀、Futures、一軍登錄／抹消、FA與海外交涉。":"中職：選秀、簽約、二軍／一軍、FA與旅外流程。"}</div>`+arr.map(x=>`<span class="pill">${x}</span>`).join("")}}
function team(t){let d=DATA[t]||{manager:"資料核對中",coaches:[],players:[],farm:[]};$("leagueView").innerHTML=`<button onclick="renderWorld()">← 返回</button><h2>${TEAM_ZH[t]}</h2><b>總教練：</b>${d.manager}<h3>教練團</h3>${d.coaches.length?d.coaches.map(x=>`<div>${x}</div>`).join(""):"<span class=mut>持續核對2026官方資料</span>"}<h3>球員</h3>${d.players.length?`<table>${d.players.map(x=>`<tr>${x.split("｜").map(y=>`<td>${y}</td>`).join("")}</tr>`).join("")}</table>`:"<span class=mut>持續核對2026現役／40人名單</span>"}<h3>農場</h3>${d.farm.map(x=>`<div class=pill>${x}</div>`).join("")}`}
function renderScout(){$("scoutView").innerHTML=Object.entries(S.scouts).length?Object.entries(S.scouts).map(([l,x])=>`<div class="event"><b>${l}</b>｜觀察 ${x.views} 次｜興趣 ${x.interest}/100<br>20–80評分：打擊80｜長打80｜速度80｜臂力80｜守備80｜投球80｜控球80</div>`).join(""):"完成正式比賽後，各聯盟球探會累積獨立觀察。";if(S.stage==="高中"&&$("scoutView"))$("scoutView").innerHTML+=`<h3>球團別追蹤</h3>${hsScoutTable()}`;}
function renderHistory(){$("history").innerHTML=S.history.length?S.history.slice().reverse().map(x=>`<div>${x}</div>`).join(""):"尚無紀錄"}
function save(a=true){localStorage.setItem(KEY,JSON.stringify(S));if(a)alert("已儲存")}function reset(){if(confirm("確定刪除生涯？")){localStorage.removeItem(KEY);location.reload()}}
function load(){schools();try{let x=JSON.parse(localStorage.getItem(KEY));if(x&&x.player)S=x}catch(e){}if(S.player){migrateSave();localStorage.setItem(KEY,JSON.stringify(S));renderCareer()}}load();
</script></body></html>
