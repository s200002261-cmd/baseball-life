<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Baseball Life MAX — Rebuild</title>
<style>
:root{--bg:#07120d;--c:#0e2118;--c2:#142d21;--l:#2d5943;--t:#f4f7f5;--m:#a9bdb0;--g:#62e6a2;--y:#ffd166;--r:#ff7b7b}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#06110b,#10271c);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}
main{max-width:820px;margin:auto;padding:18px 14px 40px}.card{background:#0e2118ee;border:1px solid var(--l);border-radius:18px;padding:17px;margin:12px 0}
h1{margin:5px 0;font-size:30px}h2{font-size:19px}.mut{color:var(--m);line-height:1.6}.hero{font-size:25px;font-weight:900;color:var(--y)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}label{display:block;color:var(--m);font-size:12px;margin:8px 0 5px}
input,select,button{width:100%;padding:12px;border:1px solid #356249;border-radius:12px;background:#09180f;color:white;font:inherit}button{background:#176b46;font-weight:800;margin-top:7px}.secondary{background:#1a3327}
.pill{display:inline-block;border:1px solid #356249;border-radius:999px;padding:5px 8px;margin:3px;font-size:11px;color:var(--g)}
.top{display:flex;justify-content:space-between;gap:8px;align-items:center}.dice{font-size:38px;color:var(--y)}
.choice{background:var(--c2);border:1px solid var(--l);border-radius:13px;padding:13px;margin:8px 0;cursor:pointer}.choice b{display:block;margin-bottom:4px}.choice.on{outline:2px solid var(--g)}
.score{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;text-align:center;align-items:center}.score strong{font-size:30px}.log{line-height:1.65;max-height:330px;overflow:auto}.hide{display:none!important}
.bar{height:8px;background:#1b3a2b;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g)}
.stat{display:grid;grid-template-columns:95px 1fr 42px;gap:7px;align-items:center;margin:7px 0}.result{border-left:3px solid var(--y);padding:10px 12px;background:#162b21;border-radius:8px;margin:10px 0}
@media(max-width:600px){.grid{grid-template-columns:1fr}h1{font-size:27px}}
</style></head><body><main>
<section id="setup">
<h1>⚾ Baseball Life MAX</h1><p class="mut">重製版：不再是「按事件看文字」。你要做選擇、參加比賽、處理打席／投球局面，生涯才會往前。</p>
<div class="card"><h2>建立球員</h2><div class="grid">
<div><label>姓名</label><input id="name" value="Alvin"></div>
<div><label>國籍</label><select id="nation" onchange="fillSchools()"><option>台灣</option><option>日本</option><option>美國</option><option>韓國</option></select></div>
<div><label>位置</label><select id="pos"><option>二刀流</option><option>投手</option><option>捕手</option><option>內野手</option><option>外野手</option></select></div>
<div><label>投打</label><select id="hand"><option>右投右打</option><option>右投左打</option><option>左投左打</option></select></div>
<div><label>高中</label><select id="school"></select></div><div><label>背號</label><input id="num" value="1"></div>
</div><p><span class="pill">全能力100</span><span class="pill">所有球種MAX</span><span class="pill">傷病0%</span><span class="pill">不衰退</span><span class="pill">你的D6永遠6</span></p>
<button onclick="newGame()">開始高一生涯</button></div></section>

<section id="game" class="hide">
<div class="card top"><div><div id="pname" class="hero"></div><div id="meta" class="mut"></div></div><div class="dice">⚅ 6</div></div>
<div class="card"><div class="top"><div><b id="date"></b><div id="phase" class="mut"></div></div><div>聲望 <b id="rep">0</b></div></div>
<div class="bar"><i id="progress"></i></div></div>

<div id="story" class="card"><h2 id="eventTitle"></h2><p id="eventText" class="mut"></p><div id="choices"></div><button id="rollBtn" class="hide" onclick="resolveChoice()">🎲 擲骰判定（固定 6）</button><div id="result"></div></div>

<div id="match" class="card hide">
<h2>正式比賽</h2><div class="score"><div><span id="ourTeam"></span><br><strong id="ourScore">0</strong></div><b>—</b><div><span id="oppTeam"></span><br><strong id="oppScore">0</strong></div></div>
<div id="situation" class="result"></div><div id="matchChoices"></div><div id="matchLog" class="log"></div>
</div>

<div class="card"><h2>高一成績</h2><div class="grid"><div>打擊：<b id="bat">0-0</b><br>HR <b id="hr">0</b>｜RBI <b id="rbi">0</b></div><div>投球：<b id="ip">0.0</b> IP<br>K <b id="k">0</b>｜ER <b id="er">0</b></div></div></div>
<div class="card"><button class="secondary" onclick="save()">儲存</button><button class="secondary" onclick="restart()">重新開始</button></div>
</section>
<script>
"use strict";
const KEY="BLMAX_REBUILD_1";
const schools={"台灣":["平鎮高中","穀保家商","高苑工商","鶯歌工商","台東體中","南英商工"],"日本":["仙台育英","花巻東","橫濱高校","健大高崎","履正社","智辯和歌山"],"美國":["IMG Academy","Orange Lutheran High School","Harvard-Westlake School","JSerra Catholic High School"],"韓國":["德壽高中","首爾高中","釜山高中","慶南高中"]};
const timeline=[
{m:"4月",p:"入學",t:"第一次球隊練習",x:"教練要確認新生的特色。你準備用哪一種方式讓教練記住你？",c:[["打擊展示","全力展示擊球品質"],["牛棚投球","展示 MAX 球速與變化球"],["守備跑壘","展示全能運動能力"]]},
{m:"5月",p:"隊內競爭",t:"爭取先發位置",x:"高年級球員仍佔據主力位置。教練安排隊內測試。",c:[["正面挑戰","直接挑戰主力位置"],["二刀流測試","同時接受投打測試"],["團隊優先","先用守備與跑壘取得上場機會"]]},
{m:"6月",p:"大賽前",t:"關鍵準備週",x:"第一個正式大賽即將開始。MAX 能力無法再提升，你要把準備轉化到哪裡？",c:[["研究對手","提高比賽情報與球探評價"],["實戰模擬","增加臨場聲望"],["媒體日","提高全國知名度"]]},
{m:"7月",p:"夏季大賽",t:"第一場正式比賽",x:"球場坐滿觀眾，也有球探在場。今天的表現會寫進你的生涯紀錄。",match:true},
{m:"7月",p:"夏季大賽",t:"淘汰賽關鍵戰",x:"贏球才能繼續前進。你再次站上全國舞台。",match:true},
{m:"8月",p:"夏季總結",t:"高一第一學期結算",x:"第一段高中生涯結束。教練與球探開始重新評估你的層級。",c:[["接受採訪","提高全國聲量"],["低調訓練","維持球隊專注"],["研究旅外","提早建立海外球探關注"]]}
];
let S={step:0,rep:0,player:{},stats:{ab:0,h:0,hr:0,rbi:0,ip:0,k:0,er:0},history:[],selected:0,match:null};
function q(s){return document.querySelector(s)}
function fillSchools(){q("#school").innerHTML=schools[q("#nation").value].map(x=>`<option>${x}</option>`).join("")}
function newGame(){S.player={name:q("#name").value||"Player",nation:q("#nation").value,pos:q("#pos").value,hand:q("#hand").value,school:q("#school").value,num:q("#num").value};q("#setup").classList.add("hide");q("#game").classList.remove("hide");render()}
function render(){
 let e=timeline[Math.min(S.step,timeline.length-1)];q("#pname").textContent=S.player.name+" #"+S.player.num;q("#meta").textContent=S.player.school+"｜"+S.player.pos+"｜OVR 100";
 q("#date").textContent="2026 "+e.m;q("#phase").textContent=e.p;q("#rep").textContent=S.rep;q("#progress").style.width=((S.step+1)/timeline.length*100)+"%";
 q("#bat").textContent=S.stats.h+"-"+S.stats.ab;q("#hr").textContent=S.stats.hr;q("#rbi").textContent=S.stats.rbi;q("#ip").textContent=S.stats.ip.toFixed(1);q("#k").textContent=S.stats.k;q("#er").textContent=S.stats.er;
 if(e.match){startMatch(e);return}
 q("#match").classList.add("hide");q("#story").classList.remove("hide");q("#eventTitle").textContent=e.t;q("#eventText").textContent=e.x;q("#result").innerHTML="";
 q("#choices").innerHTML=e.c.map((c,i)=>`<div class="choice ${i===0?"on":""}" onclick="pick(${i},this)"><b>${c[0]}</b><span class="mut">${c[1]}</span></div>`).join("");S.selected=0;q("#rollBtn").classList.remove("hide")
}
function pick(i,el){S.selected=i;document.querySelectorAll(".choice").forEach(x=>x.classList.remove("on"));el.classList.add("on")}
function resolveChoice(){let e=timeline[S.step],c=e.c[S.selected][0],gain=8+S.selected*2;S.rep+=gain;S.history.push(`${e.m}｜${c}｜🎲6｜最高判定`);q("#result").innerHTML=`<div class="result">🎲 <b>6</b>｜${c}得到最高結果。聲望 +${gain}。MAX 能力維持 100。</div><button onclick="next()">繼續生涯 →</button>`;q("#rollBtn").classList.add("hide");save(false)}
function startMatch(e){
 q("#story").classList.add("hide");q("#match").classList.remove("hide");
 if(!S.match){S.match={pa:0,our:0,opp:Math.floor(Math.random()*3),inning:1,outs:0};q("#matchLog").innerHTML=""}
 q("#ourTeam").textContent=S.player.school;q("#oppTeam").textContent=["強豪高中","地區代表校","傳統名校"][S.step%3];updateMatch()
}
function updateMatch(){
 let M=S.match;q("#ourScore").textContent=M.our;q("#oppScore").textContent=M.opp;
 if(M.pa>=4){finishMatch();return}
 let inning=[1,3,6,8][M.pa],outs=[0,1,2,2][M.pa],base=["無人在壘","一壘有人","二壘有人","一、三壘有人"][M.pa];
 q("#situation").innerHTML=`${inning}局｜${outs}出局｜${base}<br><b>輪到 ${S.player.name}</b>`;
 q("#matchChoices").innerHTML=`<div class="choice" onclick="playPA('積極攻擊')"><b>積極攻擊</b>鎖定可以長打的球</div><div class="choice" onclick="playPA('精準擊球')"><b>精準擊球</b>優先把球打強</div><div class="choice" onclick="playPA('鎖定球路')"><b>鎖定球路</b>利用 MAX 選球等待失投</div>${S.player.pos==="二刀流"||S.player.pos==="投手"?`<div class="choice" onclick="pitchSequence()"><b>登板投球</b>使用 MAX 球種解決半局</div>`:""}`
}
function playPA(style){
 let M=S.match;S.stats.ab++;let roll=Math.random(),res,runs=0;
 if(roll<.18){res="全壘打";S.stats.h++;S.stats.hr++;runs=1+(M.pa===3?2:0)}
 else if(roll<.42){res="二壘安打";S.stats.h++;runs=M.pa>0?1:0}
 else if(roll<.72){res="一壘安打";S.stats.h++;runs=M.pa===3?1:0}
 else if(roll<.88){res="四壞保送";S.stats.ab--}
 else{res="強勁出局"}
 S.stats.rbi+=runs;M.our+=runs;M.pa++;S.rep+=2;
 q("#matchLog").innerHTML=`<div>🎲6｜${style} → <b>${res}</b>${runs?`，${runs} 打點`:""}</div>`+q("#matchLog").innerHTML;updateMatch()
}
function pitchSequence(){let M=S.match,k=2+Math.floor(Math.random()*2);S.stats.ip+=1;S.stats.k+=k;let er=Math.random()<.15?1:0;S.stats.er+=er;M.opp+=er;M.pa++;S.rep+=2;q("#matchLog").innerHTML=`<div>🎲6｜MAX 投球：1.0 IP、${k} K、${er} ER</div>`+q("#matchLog").innerHTML;updateMatch()}
function finishMatch(){let M=S.match;if(M.our<=M.opp)M.our=M.opp+1;q("#ourScore").textContent=M.our;q("#oppScore").textContent=M.opp;q("#situation").innerHTML=`比賽結束｜<b>${S.player.school} ${M.our}：${M.opp} 勝</b>`;q("#matchChoices").innerHTML=`<button onclick="endMatch()">完成比賽，繼續生涯 →</button>`}
function endMatch(){S.rep+=12;S.history.push(`${timeline[S.step].m}｜正式比賽勝利｜聲望+12`);S.match=null;next()}
function next(){S.step++;if(S.step>=timeline.length){q("#story").classList.remove("hide");q("#match").classList.add("hide");q("#eventTitle").textContent="高一第一學期完成";q("#eventText").textContent=`你以聲望 ${S.rep} 完成第一階段。下一版將從秋季賽、國際賽選拔與高二生涯繼續。`;q("#choices").innerHTML="";q("#rollBtn").classList.add("hide");q("#result").innerHTML="";save(false);return}render();save(false)}
function save(show=true){localStorage.setItem(KEY,JSON.stringify(S));if(show)alert("已儲存")}
function restart(){if(confirm("確定刪除這個生涯？")){localStorage.removeItem(KEY);location.reload()}}
function load(){fillSchools();try{let x=JSON.parse(localStorage.getItem(KEY));if(x&&x.player&&x.player.name){S=x;q("#setup").classList.add("hide");q("#game").classList.remove("hide");render()}}catch(e){console.error(e)}}
addEventListener("DOMContentLoaded",load);
</script></body></html>
